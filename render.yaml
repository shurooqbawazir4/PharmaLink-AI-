# Free Render demo deployment. Import this file with New > Blueprint.
services:
  - type: web
    name: medcycle-api-salem-bawazir
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./docker/Dockerfile.backend
    dockerContext: .
    dockerCommand: /bin/sh /app/backend/scripts/render_start.sh
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: SEED_DEMO_DATA
        value: "true"
      - key: ENABLE_TIMESCALEDB
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: medcycle-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: medcycle-cache
          type: keyvalue
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://medcycle-salem-bawazir.onrender.com

  - type: web
    name: medcycle-salem-bawazir
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./docker/Dockerfile.frontend
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: HOSTNAME
        value: 0.0.0.0
      - key: NEXT_PUBLIC_API_URL
        value: https://medcycle-api-salem-bawazir.onrender.com/api/v1

  - type: keyvalue
    name: medcycle-cache
    plan: free
    region: frankfurt
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

databases:
  - name: medcycle-db
    plan: free
    region: frankfurt
    databaseName: medcycle
    user: medcycle
    ipAllowList: []
