[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medcycle-backend"
version = "0.1.0"
description = "PharmaLink AI backend — medication intelligence platform API."
requires-python = ">=3.12"
readme = "README.md"
license = { text = "Proprietary" }

dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "pydantic[email]>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "asyncpg>=0.30,<0.31",
    "alembic>=1.13,<2.0",
    "celery>=5.4,<6.0",
    "redis>=5.1,<6.0",
    "pyjwt[crypto]>=2.9,<3.0",
    "bcrypt>=4.1,<6.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27,<0.28",
    "python-dotenv>=1.0,<2.0",
    "pandas>=2.2,<3.0",
    "openai>=1.50,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<0.25",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.7,<0.8",
    "mypy>=1.13,<2.0",
    "aiosqlite>=0.20,<0.21",
    "pandas-stubs>=2.2,<3.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Alembic migrations are autogenerated (or hand-extended from autogenerated
# output) and follow Alembic's own formatting conventions, not ours.
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = ["B008"]  # FastAPI's Depends(...) in default args is idiomatic.

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]
# `forecasting`/`optimization` (the /ml package, see ml/pyproject.toml) are
# pip-installed editable from ../ml — mypy_path makes them resolvable by
# static analysis the same way Python resolves them at runtime.
mypy_path = ["../ml"]

[[tool.mypy.overrides]]
# No type stubs published for these — real gaps in the ecosystem, not
# something this project can fix.
module = ["ortools.*", "sklearn.*", "celery.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
