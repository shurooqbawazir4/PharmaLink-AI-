# MedCycle AI — local development stack (dev-mode frontend, no nginx).
# For a production-shaped stack (standalone frontend build + nginx reverse
# proxy on :80), layer docker-compose.prod.yml on top — see
# docs/deployment.md.
#
# Usage:
#   cp docker/.env.example docker/.env   # then fill in secrets
#   docker compose -f docker/docker-compose.yml --env-file docker/.env up

services:
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: medcycle_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medcycle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medcycle_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-medcycle}
    ports:
      - "5432:5432"
    volumes:
      - medcycle_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medcycle} -d ${POSTGRES_DB:-medcycle}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: medcycle_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: medcycle_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-medcycle}:${POSTGRES_PASSWORD:-medcycle_dev_password}@db:5432/${POSTGRES_DB:-medcycle}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app/backend
      - ../data:/app/data
      - ../ml:/app/ml
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: medcycle_celery_worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-medcycle}:${POSTGRES_PASSWORD:-medcycle_dev_password}@db:5432/${POSTGRES_DB:-medcycle}
      REDIS_URL: redis://redis:6379/0
    command: celery -A app.core.celery_app worker --loglevel=info
    volumes:
      - ../backend:/app/backend
      - ../data:/app/data
      - ../ml:/app/ml
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: medcycle_celery_beat
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-medcycle}:${POSTGRES_PASSWORD:-medcycle_dev_password}@db:5432/${POSTGRES_DB:-medcycle}
      REDIS_URL: redis://redis:6379/0
    command: celery -A app.core.celery_app beat --loglevel=info
    volumes:
      - ../backend:/app/backend
      - ../data:/app/data
      - ../ml:/app/ml
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      target: dev
    container_name: medcycle_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ../frontend:/app/frontend
      - /app/frontend/node_modules
      - /app/frontend/.next
    depends_on:
      - backend

  # One-off data pipeline: real-signal ingestion + synthetic generation.
  # Not part of `up` — run explicitly, e.g.:
  #   docker compose -f docker/docker-compose.yml --env-file docker/.env run --rm pipeline python pipeline/fetch_fluview.py
  pipeline:
    build:
      context: ..
      dockerfile: docker/Dockerfile.pipeline
    container_name: medcycle_pipeline
    volumes:
      - ../data:/app/data

volumes:
  medcycle_db_data:
