# PharmaLink AI — production-shaped overlay: standalone frontend build (no
# bind mount, no dev deps) + nginx as the single entry point on :80. Layer
# on top of docker-compose.yml rather than duplicating db/redis/backend:
#
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.prod.yml \
#     --env-file docker/.env up -d --build
#
# backend/celery_worker/celery_beat are unchanged from the dev file — this
# overlay only touches what actually differs in production: the frontend
# build target/vars, and fronting everything with nginx. TLS termination
# is out of scope here — see docs/deployment.md.

services:
  frontend:
    build:
      target: prod
      args:
        NEXT_PUBLIC_API_URL: /api/v1
    # `!reset` (not `[]`/`{}`) is required to actually clear a list/map
    # inherited from docker-compose.yml — Compose's default list merge
    # unions rather than replaces, so an empty override is otherwise a
    # silent no-op and the dev bind mount/port stick around.
    environment: !reset {}
    volumes: !reset []
    ports: !reset []

  backend:
    ports: !reset []

  nginx:
    image: nginx:1.27-alpine
    container_name: medcycle_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
