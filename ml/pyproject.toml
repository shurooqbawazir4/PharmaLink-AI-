[project]
name = "medcycle-ml"
version = "0.1.0"
description = "PharmaLink AI ML package: demand forecasting + network transfer optimization."
requires-python = ">=3.12"

dependencies = [
    "lightgbm>=4.5,<5.0",
    "ortools>=9.11,<10.0",
    "pandas>=2.2,<3.0",
    "numpy>=1.26,<3.0",
    "scikit-learn>=1.5,<2.0",
]

[tool.setuptools.packages.find]
include = ["forecasting*", "optimization*"]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"
